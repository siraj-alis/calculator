<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>calculator by siraj</title>
</head>
<body>
    <div class="container">
        <input id="display" type="text" placeholder="0">
        <div>
            <p>
                <button class="op" onclick=" ClearDisplay('');">Ac</button>
                <button class="op" id="ClearDisplay" onclick=" clearOneCharacter('');">DEL</li>
                <button class="op" onclick=" toDisplay('%');">%</button>
                <button class="op" onclick=" toDisplay('/');">/</button>
            </p>
        </div>
        <div>
            <p>
                <button onclick=" toDisplay('7');">7</button>
                <button onclick=" toDisplay('8');">8</button>
                <button onclick=" toDisplay('9');">9</button>
                <button class="op" onclick="toDisplay('*')">*</button>
            </p>
        </div>
        <div>
            <p>
                <button onclick=" toDisplay('4');">4</button>
                <button onclick=" toDisplay('5');">5</button>
                <button onclick=" toDisplay('6');">6</button>
                <button class="op" onclick=" toDisplay('-');">-</button>
            </p>
        </div>
        <div>
            <p>
                <button onclick=" toDisplay('1');">1</button>
                <button onclick=" toDisplay('2');">2</button>
                <button onclick=" toDisplay('3');">3</button>
                <button class="op" onclick=" toDisplay('+');">+</button>
            </p>
        </div>
        <div>
            <p>
                <button onclick=" toDisplay('00');">00</button>
                <button onclick=" toDisplay('0');">0</button>
                <button onclick=" toDisplay('.');">.</button>
                <button class="op" onclick="calculator('=')">=</button>
            </p>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function toDisplay(input) {
            display.value += input;
        }
        function ClearDisplay() {
            display.value= "";
        }
        function calculator() {
            display.value = eval(display.value);
        }
        function clearOneCharacter() {
            const displayElement = document.getElementById('display'); // Assuming your display element has this ID
            let currentValue = displayElement.value; // Or .textContent if it's a div/span

            if (currentValue.length > 0) {
            displayElement.value = currentValue.slice(0, -1);
        }
    }

    </script>
</body>
</html>
